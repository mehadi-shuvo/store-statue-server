services:
  postgres:
    image: postgres:latest
    container_name: game-express-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ontor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: game-express-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
